appId: eu.siacs.conversations
name: Bind 2
tags:
    - sasl2
onFlowStart:
    - runScript: scripts/checkHealth.js
    - startRecording: bind2
onFlowComplete:
    - stopRecording
---

- runScript: scripts/startSession.js

- runFlow:
    file: subflows/login.yaml

- runFlow:
    file: subflows/dismiss-onboarding-dialogs.yaml

# Received Bind2 features
- runScript:
      file: scripts/checkForLogs.js
      env:
          PATTERN: '.* inline bind features: .*'

# Reports Bind2 support
- tapOn: "More options"
- tapOn: "Manage accounts"
- tapOn: "jane@example.org"
- tapOn: "More options"
- tapOn: "Server info"
- tapOn:
    id: "key_pos_ime_action"
    optional: true
    label: Close Google keyboard, if visible
- runFlow:
    when:
      visible:
        id: keyboard_view
    commands:
      - tapOn: Done
    label: Close AOSP keyboard, if visible

- assertVisible:
    id: "server_info_bind2"
    text: "available"
- takeScreenshot: server_info
