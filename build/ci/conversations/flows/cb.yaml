appId: eu.siacs.conversations
tags:
    - demoboot
onFlowStart:
    - runScript: scripts/checkHealth.js
---

- runScript: scripts/startSession.js

- launchApp:
    clearState: true

- assertVisible: "I already have an account"

- runScript: 
    file: scripts/checkForLogs.js
    env:
        PATTERN: initializing database.*

- tapOn: "I already have an account"
- tapOn: "More options"
- tapOn: "Settings"
- tapOn: "Connection"
- tapOn: "Show extended connection settings when setting up an account"
- tapOn: "Navigate up"
- tapOn: "Navigate up"

- tapOn: "XMPP address"
- inputText: "jane@example.org"
- tapOn: "Password"
- inputText: "secret"
- tapOn: "Hostname"
- inputText: "10.0.2.2"
- tapOn: "Next"

- assertVisible: "Accept Unknown Certificate?"
- tapOn: "Always"

- runScript:
      file: scripts/checkForLogs.js
      env:
          # Pinned to SHA-256/512-PLUS. Conversations won't pick it while stronger mechanisms are available.
          # Just "-PLUS" would silently pass if a regression caused a downgrade back to SHA-1-PLUS.
          PATTERN: 'jane@example\.org.*Authenticating with SASL\/SCRAM-SHA-(256|512)-PLUS'

- runScript:
      file: scripts/checkForLogs.js
      env:
          PATTERN: 'jane@example\.org.*logged in \(using SASL\)'
