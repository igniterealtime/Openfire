appId: eu.siacs.conversations
name: SASL2
tags:
    - sasl2
onFlowStart:
    - runScript: scripts/checkHealth.js
---

- runScript: scripts/startSession.js

- runFlow:
    file: subflows/login.yaml

- runFlow:
    file: subflows/dismiss-onboarding-dialogs.yaml

# Using SASL2
- runScript:
    file: scripts/checkForLogs.js
    env:
        PATTERN: .*SASL 2.0 authorization identifier was jane@example.org

# Using Channel Binding
- runScript:
      file: scripts/checkForLogs.js
      env:
          PATTERN: 'jane@example\.org.*Authenticating with SASL_2\/[A-Z0-9-]+-PLUS'

# Authentication successful
- runScript:
      file: scripts/checkForLogs.js
      env:
          PATTERN: 'jane@example\.org.*logged in \(using SASL_2\)'
